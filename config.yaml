# ==============================================================================
# MIDI Mobile Manipulator Base Configuration
# Dual DDSM Direct Drive Motors + Logitech F710 Gamepad + Waveshare UPS HAT
# ==============================================================================

# Serial RS485 Bus Configuration
serial:
  port: "/dev/ttyUSB0"          # RS485 USB-to-Serial adapter path
  baudrate: 115200              # Standard DDSM baudrate
  timeout: 0.02                 # Fast serial read timeout in seconds

# Motor Parameters
motors:
  type: "ddsm115"               # "ddsm115" or "ddsm210"
  left_id: 1                    # RS485 ID of Left Motor
  right_id: 2                   # RS485 ID of Right Motor
  invert_left: false            # Invert left motor direction if needed
  invert_right: true            # Invert right motor (mirrored mounting on chassis)

# Motion Dynamics & Slew Rate Profiling
robot:
  turn_ratio: 0.65              # Pivot turn speed ratio (0.65 = 65% of speed level)
  turn_dir: 1                   # Turn direction multiplier (1 or -1)
  accel_rate: 1500.0            # Acceleration in RPM/s (smooth takeoff)
  decel_rate: 1000.0            # Deceleration in RPM/s on releasing stick (quick stop)
  brake_rate: 3000.0            # Emergency brake rate in RPM/s (when B button held)

# Logitech Wireless Gamepad F710 Configuration (evdev)
gamepad:
  device_path: null             # null = auto-detect (/dev/input/event* matching gamepad)
  deadzone: 0.10                # Analog stick center deadzone to prevent drift
  speed_levels: [50.0, 100.0, 150.0, 200.0]  # RPM levels (LB = speed up, RB = speed down)
  default_speed_level: 1        # Starting index (0=50, 1=100, 2=150, 3=200 RPM)

# Waveshare UPS HAT / Battery Telemetry Configuration
ups_hat:
  enabled: true                 # Set to false to disable battery I2C monitoring
  i2c_bus: 1                    # Raspberry Pi default I2C bus
  i2c_address: "0x41"           # Waveshare UPS HAT INA219 I2C address
  battery_type: "ups_2s"        # "ups_2s" (HAT 2S pack) or "makita_18v" (18V pack)

# Control Loop Timing
control:
  loop_hz: 50.0                 # Synchronous loop frequency (50 Hz = 20ms period)
  telemetry_interval: 0.20      # Status print interval in seconds
